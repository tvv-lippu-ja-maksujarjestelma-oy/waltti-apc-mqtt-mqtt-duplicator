name: Dependency policy
on:
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        labeled,
        unlabeled,
        ready_for_review,
        converted_to_draft,
        auto_merge_enabled,
      ]
  workflow_run:
    workflows:
      - Dependency review signal
      - "CI/CD: Continuous integration and continuous deployment"
      - CodeQL
      - Trivy
    types: [completed]
  status:
  check_run:
    types: [completed, rerequested]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: write
concurrency:
  group: dependency-policy-native
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./.github/dependency-policy/native.cjs').run({github, context, core});
